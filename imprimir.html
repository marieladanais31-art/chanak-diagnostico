<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuadernillo de Evaluación Diagnóstica — Chanak International Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ═════════════════════════════════════════════════════════════════
       CONFIGURACIÓN INSTITUCIONAL DE IMPRESIÓN (PDF & PAPEL FÍSICO)
       ═════════════════════════════════════════════════════════════════ */
    :root {
      --azul: #102a54;
      --azul-light: #f0f4f9;
      --oro: #9c6c15;
      --oro-light: #fdf8ed;
      --gris-oscuro: #1e293b;
      --gris-medio: #475569;
      --gris-claro: #cbd5e1;
      --borde: #cbd5e1;
      --fondo: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--gris-oscuro);
      background: #eaeff5;
      line-height: 1.5;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── BARRA SUPERIOR DE CONTROL (SOLO EN PANTALLA) ── */
    .screen-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0f1d38;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 4px 18px rgba(0,0,0,0.22);
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toolbar-brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      letter-spacing: .02em;
    }
    .toolbar-brand span {
      color: #eab308;
      font-weight: 400;
      font-size: 0.85rem;
      margin-left: 6px;
      font-family: 'DM Sans', sans-serif;
    }
    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar-select, .toolbar-input {
      background: #1e2e4f;
      color: #fff;
      border: 1px solid #3b507d;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      outline: none;
    }
    .toolbar-select:focus, .toolbar-input:focus {
      border-color: #38bdf8;
    }
    .btn-action {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.15s;
      box-shadow: 0 2px 8px rgba(22,163,74,0.35);
    }
    .btn-action:hover {
      background: #15803d;
      transform: translateY(-1px);
    }
    .btn-back {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 7px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-back:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    /* ── HOJAS DEL DOCUMENTO / FORMATO CARTA ── */
    .document-wrapper {
      max-width: 820px;
      margin: 28px auto 60px;
      background: #fff;
      padding: 44px 50px;
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(15,23,42,0.12);
    }

    /* ── ENCABEZADO INSTITUCIONAL ── */
    .exam-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 2.5px solid var(--azul);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .header-logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }
    .header-title-block h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.28rem;
      font-weight: 800;
      color: var(--azul);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .header-title-block p {
      font-size: 0.74rem;
      color: var(--gris-medio);
      font-weight: 500;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .header-badge-block {
      text-align: right;
    }
    .header-badge {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--azul);
    }
    .header-badge small {
      display: block;
      font-size: 0.65rem;
      color: #64748b;
      font-weight: 500;
    }

    /* ── TÍTULO DEL EXAMEN ── */
    .exam-title-card {
      text-align: center;
      background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .exam-title-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--azul);
      font-weight: 800;
      margin-bottom: 2px;
    }
    .exam-title-card .exam-subtitle {
      font-size: 0.82rem;
      color: var(--gris-medio);
      font-weight: 600;
    }

    /* ── FICHA DE DATOS DEL ESTUDIANTE ── */
    .student-info-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px 14px;
      background: #fff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .info-field {
      display: flex;
      flex-direction: column;
    }
    .info-field label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gris-medio);
      margin-bottom: 3px;
    }
    .info-line {
      border-bottom: 1px solid #94a3b8;
      min-height: 22px;
      font-size: 0.90rem;
      font-weight: 600;
      color: var(--azul);
      padding: 0 2px 2px;
    }

    /* ── CUADRO DE INSTRUCCIONES ── */
    .exam-instructions {
      background: var(--oro-light);
      border-left: 4px solid var(--oro);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 22px;
      font-size: 0.80rem;
      line-height: 1.45;
      color: #634305;
    }
    .exam-instructions strong {
      color: #452e03;
    }

    /* ── SECCIONES Y MATERIAS ── */
    .subject-section {
      margin-bottom: 30px;
    }
    .subject-header {
      background: var(--azul);
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      break-after: avoid;
      page-break-after: avoid;
    }
    .subject-header small {
      font-weight: 400;
      font-size: 0.75rem;
      opacity: 0.9;
    }

    .level-block {
      margin-bottom: 22px;
    }
    .level-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--azul);
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 4px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      break-after: avoid;
      page-break-after: avoid;
    }
    .level-title .level-tag {
      background: #e2e8f0;
      color: #334155;
      font-size: 0.70rem;
      padding: 1px 8px;
      border-radius: 4px;
    }

    /* ── TARJETAS DE PREGUNTAS (DISEÑADAS PARA NO CORTARSE EN PÁGINA) ── */
    .question-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 11px 14px;
      margin-bottom: 10px;
      background: #ffffff;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .q-top-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .q-num {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--azul);
      min-width: 24px;
    }
    .q-prompt {
      flex: 1;
      font-weight: 600;
      font-size: 0.92rem;
      color: #0f172a;
      line-height: 1.4;
    }
    .q-skill-code {
      font-size: 0.65rem;
      font-weight: 600;
      color: #64748b;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* ── OPCIONES DE RESPUESTA (OPCIÓN MÚLTIPLE) ── */
    .q-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
      margin-top: 8px;
      padding-left: 28px;
    }
    .q-opt-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: #334155;
      padding: 3px 0;
    }
    .q-bubble {
      width: 17px;
      height: 17px;
      border: 1.5px solid #475569;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: #475569;
      flex-shrink: 0;
      background: #fff;
    }

    /* ── ESPACIO DE PROCEDIMIENTO Y RESPUESTA ABIERTA ── */
    .q-open-workspace {
      margin-top: 8px;
      margin-left: 28px;
    }
    .q-work-box {
      border: 1px dashed #94a3b8;
      border-radius: 6px;
      background: #fafafa;
      height: 52px;
      padding: 4px 8px;
      font-size: 0.70rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .q-ans-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--azul);
    }
    .q-line-fill {
      flex: 1;
      border-bottom: 1.5px solid #64748b;
      height: 18px;
    }

    /* ── SECCIÓN DE MUESTRA DE ESCRITURA A MANO ── */
    .handwriting-section {
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px 18px;
      background: #fff;
      margin-top: 24px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .handwriting-section h4 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--azul);
      margin-bottom: 4px;
    }
    .handwriting-prompt {
      font-size: 0.84rem;
      color: #334155;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .ruled-lines {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 10px;
    }
    .ruled-line {
      border-bottom: 1px solid #94a3b8;
      height: 4px;
    }

    /* ── INSTRUCCIONES DE ENTREGA FÍSICA Y FIRMAS ── */
    .exam-footer-box {
      margin-top: 30px;
      border-top: 2px solid var(--azul);
      padding-top: 16px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .submission-guide {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.80rem;
      line-height: 1.45;
      color: #1e293b;
    }
    .submission-guide h5 {
      color: var(--azul);
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .signatures-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 24px;
    }
    .sig-col {
      text-align: center;
    }
    .sig-line {
      border-bottom: 1px solid #475569;
      height: 40px;
      margin-bottom: 6px;
    }
    .sig-label {
      font-size: 0.74rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
    }

    /* ── SALTOS DE PÁGINA LIMPIOS ── */
    .page-break-before {
      page-break-before: always;
      break-before: page;
    }

    /* ── ADAPTACIÓN DE IMPRESIÓN OFICIAL ── */
    @media print {
      body {
        background: #fff!important;
        color: #000!important;
        font-size: 11.5pt!important;
      }
      .screen-toolbar, .no-print {
        display: none!important;
      }
      .document-wrapper {
        max-width: 100%!important;
        margin: 0!important;
        padding: 0!important;
        box-shadow: none!important;
        border-radius: 0!important;
      }
      .subject-header {
        background: #0f1d38!important;
        color: #fff!important;
        -webkit-print-color-adjust: exact!important;
        print-color-adjust: exact!important;
      }
      .exam-instructions {
        border-left-color: #9c6c15!important;
        background: #fefce8!important;
        -webkit-print-color-adjust: exact!important;
        print-color-adjust: exact!important;
      }
      .question-card {
        border: 1px solid #d1d5db!important;
      }
      @page {
        size: letter;
        margin: 14mm 12mm 14mm 12mm;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR DE ACCIÓN (SOLO EN PANTALLA) -->
  <header class="screen-toolbar no-print">
    <div class="toolbar-left">
      <a href="/evaluacion.html" class="btn-back">← Volver a la evaluación interactiva</a>
      <div class="toolbar-brand">Chanak International Academy <span>· Cuadernillo Imprimible PDF</span></div>
    </div>
    <div class="toolbar-controls">
      <label style="font-size:0.80rem;color:#cbd5e1">Grado / Programa:</label>
      <select id="ctrl-grade" class="toolbar-select" onchange="reloadExam()">
        <option value="2">Grade 2 (2.º de Primaria)</option>
        <option value="3">Grade 3 (3.º de Primaria)</option>
        <option value="4">Grade 4 (4.º de Primaria)</option>
        <option value="5" selected>Grade 5 (5.º de Primaria)</option>
        <option value="6">Grade 6 (6.º de Primaria)</option>
        <option value="7">Grade 7 (1.º ESO)</option>
        <option value="8">Grade 8 (2.º ESO)</option>
        <option value="9">Grade 9 (3.º ESO / Freshman)</option>
        <option value="10">Grade 10 (4.º ESO / Sophomore)</option>
        <option value="11">Grade 11 (1.º Bach / Junior)</option>
        <option value="12">Grade 12 (2.º Bach / Senior)</option>
        <option value="dual">Dual Diploma / Adult High School (CEFR A1-C2)</option>
      </select>

      <input type="text" id="ctrl-name" class="toolbar-input" placeholder="Nombre del alumno (opcional)" oninput="updateStudentHeader()">

      <button type="button" class="btn-action" onclick="window.print()">
        🖨️ Descargar en PDF / Imprimir
      </button>
    </div>
  </header>

  <!-- CONTENEDOR DEL DOCUMENTO OFICIAL -->
  <main class="document-wrapper" id="exam-document">
    <div id="loading-state" style="text-align:center;padding:50px 20px;font-size:1.1rem;color:var(--azul);">
      Generando cuadernillo de examen con diseño institucional…
    </div>
    <div id="exam-render-target"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    // Obtener parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    let currentToken = urlParams.get('k') || '';
    let currentGrade = urlParams.get('grade') || '5';
    let currentTrack = urlParams.get('track') || (currentGrade === 'dual' ? 'dual' : 'off');
    let currentName = urlParams.get('name') || '';

    // Sincronizar selectores iniciales
    if (currentTrack === 'dual' || currentGrade === 'dual') {
      $('ctrl-grade').value = 'dual';
    } else if (currentGrade) {
      $('ctrl-grade').value = currentGrade;
    }
    if (currentName) {
      $('ctrl-name').value = currentName;
    }

    async function loadExam() {
      $('loading-state').style.display = 'block';
      $('exam-render-target').innerHTML = '';

      const selVal = $('ctrl-grade').value;
      const isDual = selVal === 'dual';
      const grade = isDual ? '12' : selVal;
      const track = isDual ? 'dual' : 'off';
      const name = $('ctrl-name').value.trim();

      let apiUrl = `/api/diag-exam?track=${track}&grade=${grade}`;
      if (currentToken) apiUrl += `&k=${encodeURIComponent(currentToken)}`;
      if (name) apiUrl += `&name=${encodeURIComponent(name)}`;

      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('Error al cargar examen (' + res.status + ')');
        const data = await res.json();
        renderExam(data);
      } catch (err) {
        $('loading-state').innerHTML = `<p style="color:#b91c1c;font-weight:bold">No se pudo cargar la prueba diagnóstica: ${err.message}</p>
        <p style="margin-top:10px"><button onclick="loadExam()" class="btn-action">Reintentar</button></p>`;
      }
    }

    function renderExam(data) {
      $('loading-state').style.display = 'none';
      const isDual = data.track === 'dual';
      const studentName = $('ctrl-name').value.trim() || data.student?.name || '';
      if (studentName && !$('ctrl-name').value) $('ctrl-name').value = studentName;

      const programLabel = isDual ? 'Dual Diploma / Adult High School Completion' : `Off-Campus K-12 (Florida B.E.S.T.)`;
      const gradeTitle = isDual ? 'English Placement Assessment (CEFR A1 to C2)' : `Grade ${data.grade} Academic Diagnostic Assessment`;
      const startInfo = isDual ? 'Levels: A1, A2, B1, B2, C1, C2' : `Starting Level: Grade ${data.startLevel} → Grade ${data.grade}`;
      const tokenDisplay = currentToken || data.student?.token || '—';

      let html = `
        <!-- ENCABEZADO INSTITUCIONAL -->
        <header class="exam-header">
          <div class="header-logo-wrap">
            <img src="/logo-chanak.png" alt="Chanak Logo" class="header-logo">
            <div class="header-title-block">
              <h1>CHANAK INTERNATIONAL ACADEMY</h1>
              <p>Evaluation · Education · Excellence · Florida School Code #134620</p>
            </div>
          </div>
          <div class="header-badge-block">
            <div class="header-badge">
              CHANAK FLEX
              <small>Assessment Document</small>
            </div>
          </div>
        </header>

        <!-- TÍTULO DEL CUADERNILLO -->
        <div class="exam-title-card">
          <h2>${gradeTitle}</h2>
          <div class="exam-subtitle">${programLabel} · ${startInfo}</div>
        </div>

        <!-- FICHA DE DATOS DEL ALUMNO -->
        <div class="student-info-grid">
          <div class="info-field">
            <label>Nombre del Estudiante / Student Full Name</label>
            <div class="info-line" id="disp-student-name">${escapeHtml(studentName)}</div>
          </div>
          <div class="info-field">
            <label>Curso / Grade Level</label>
            <div class="info-line">${isDual ? 'Adult / Dual' : 'Grade ' + data.grade}</div>
          </div>
          <div class="info-field">
            <label>Fecha / Date</label>
            <div class="info-line">${new Date().toLocaleDateString('es-ES')}</div>
          </div>
          <div class="info-field">
            <label>Programa / Modality</label>
            <div class="info-line">${programLabel}</div>
          </div>
          <div class="info-field">
            <label>Código de Enlace / Token</label>
            <div class="info-line" style="font-family:monospace;font-size:0.75rem">${tokenDisplay}</div>
          </div>
          <div class="info-field">
            <label>Evaluador / Mentor</label>
            <div class="info-line">Chanak Admissions & Mentorship</div>
          </div>
        </div>

        <!-- CUADRO DE INSTRUCCIONES -->
        <div class="exam-instructions">
          <strong>Instrucciones para el estudiante y la familia / Assessment Instructions:</strong>
          <ul style="margin:6px 0 0 16px;line-height:1.45">
            <li><strong>Lee cada pregunta con atención.</strong> En preguntas de opción múltiple, rellena o marca con una cruz <code>(X)</code> el círculo correspondiente.</li>
            <li>En preguntas de <strong>Matemáticas</strong>, utiliza el recuadro de procedimiento para realizar tus cálculos a lápiz y escribe tu respuesta final en la línea.</li>
            <li><strong>Importante:</strong> Si encuentras una pregunta que aún no has aprendido o te resulta muy difícil, <em>puedes dejarla en blanco</em>. Es completamente normal en una evaluación diagnóstica para ubicar con precisión tu punto de partida.</li>
            <li>Una vez completado el examen en papel, toma fotos claras o escanea las páginas y súbelas en tu enlace personal para emitir tu <strong>PEI (Plan Educativo Individualizado)</strong>.</li>
          </ul>
        </div>
      `;

      let qIndex = 1;

      // Iterar por materias
      data.sections.forEach((sec, sIdx) => {
        const breakClass = sIdx > 0 ? 'page-break-before' : '';
        html += `
          <div class="subject-section ${breakClass}">
            <div class="subject-header">
              <span>${sec.title}</span>
              <small>${sec.levels.reduce((acc, l) => acc + l.items.length, 0)} preguntas</small>
            </div>
            <p style="font-size:0.80rem;color:#475569;margin-bottom:14px;font-style:italic">${sec.instructions}</p>
        `;

        sec.levels.forEach((lvl) => {
          html += `
            <div class="level-block">
              <div class="level-title">
                <span>${lvl.label}</span>
                <span class="level-tag">${lvl.items.length} preguntas</span>
              </div>
          `;

          lvl.items.forEach((item) => {
            const isMcq = Array.isArray(item.options) && item.options.length > 0;
            const isTextOrNumeric = !isMcq;

            html += `
              <div class="question-card">
                <div class="q-top-row">
                  <span class="q-num">${qIndex}.</span>
                  <div class="q-prompt">${escapeHtml(item.prompt)}</div>
                  ${item.skill ? `<span class="q-skill-code">${escapeHtml(item.skill)}</span>` : ''}
                </div>
            `;

            if (isMcq) {
              const letters = ['A', 'B', 'C', 'D', 'E'];
              html += `<div class="q-options-grid">`;
              item.options.forEach((opt, oIdx) => {
                html += `
                  <div class="q-opt-item">
                    <span class="q-bubble">${letters[oIdx] || '•'}</span>
                    <span>${escapeHtml(opt)}</span>
                  </div>
                `;
              });
              html += `</div>`;
            } else {
              // Respuesta abierta / numérica con espacio de trabajo
              html += `
                <div class="q-open-workspace">
                  <div class="q-work-box">Espacio para cálculos y procedimiento / Show your work:</div>
                  <div class="q-ans-line">
                    <span>Respuesta / Final Answer:</span>
                    <div class="q-line-fill"></div>
                  </div>
                </div>
              `;
            }

            html += `</div>`;
            qIndex++;
          });

          html += `</div>`; // .level-block
        });

        html += `</div>`; // .subject-section
      });

      // Muestra de escritura a mano (Handwriting sample)
      html += `
        <div class="handwriting-section page-break-before">
          <h4>Muestra de Escritura y Expresión Escrita (Handwriting & Composition Sample)</h4>
          <p class="handwriting-prompt">
            <strong>Instrucción / Prompt:</strong> Escribe a mano un párrafo breve (de 4 a 6 líneas) en inglés (o en español si realizas la sección de castellano) sobre un tema que te guste: tu pasatiempo favorito, una meta académica o una experiencia que recuerdes con alegría.
          </p>
          <div class="ruled-lines">
            <div class="ruled-line"></div>
            <div class="ruled-line"></div>
            <div class="ruled-line"></div>
            <div class="ruled-line"></div>
            <div class="ruled-line"></div>
            <div class="ruled-line"></div>
          </div>
        </div>

        <!-- PIE DE ENTREGA Y FIRMAS -->
        <div class="exam-footer-box">
          <div class="submission-guide">
            <h5>¿Cómo registrar tus respuestas para recibir tu PEI?</h5>
            <p>1. Al terminar este cuadernillo, accede a <strong>https://chanak-diagnostico.vercel.app/evaluacion.html</strong> con tu enlace personal <code>${tokenDisplay}</code>.</p>
            <p>2. Puedes ingresar tus respuestas directamente en la plataforma o usar la sección <strong>"📎 Subir documentos / fotos del examen"</strong> para adjuntar las fotografías de cada hoja resuelta.</p>
            <p>3. El equipo de coordinación y tu mentor general evaluarán tu trabajo y emitirán tu informe oficial de nivel y Plan Educativo Individualizado (PEI).</p>
          </div>

          <div class="signatures-row">
            <div class="sig-col">
              <div class="sig-line"></div>
              <div class="sig-label">Firma del Estudiante / Student Signature</div>
            </div>
            <div class="sig-col">
              <div class="sig-line"></div>
              <div class="sig-label">Firma del Padre / Madre / Tutor / Evaluador</div>
            </div>
          </div>

          <p style="text-align:center;font-size:0.72rem;color:#94a3b8;margin-top:20px">
            Chanak International Academy · Florida FLDOE #134620 · www.chanakacademy.org · admisiones@chanakacademy.org
          </p>
        </div>
      `;

      $('exam-render-target').innerHTML = html;
    }

    function reloadExam() {
      loadExam();
    }

    function updateStudentHeader() {
      const val = $('ctrl-name').value.trim();
      const disp = $('disp-student-name');
      if (disp) disp.textContent = val;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Cargar examen automáticamente al abrir
    loadExam();
  </script>
</body>
</html>
